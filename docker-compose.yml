services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airbridge
      POSTGRES_PASSWORD: airbridge
      POSTGRES_DB: airbridge
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbridge"]
      interval: 2s
      timeout: 2s
      retries: 15
